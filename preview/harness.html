<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<title>balance-gauge harness</title>
<style>
  body { margin: 0; padding: 14px 16px; background: #f6f7f9; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  #root { width: 280px; }
  .mount { margin-bottom: 6px; }
  #log { font: 11px/1.5 Consolas, monospace; color: #666; white-space: pre-wrap; }
  #result { font: 11px/1.5 Consolas, monospace; color: #1f2329; white-space: pre-wrap; }
</style>
<body>
<div id="root"></div>
<div id="log">booting…</div>
<script>
const params = new URLSearchParams(location.search)
const amount = params.get('amount') ?? '88.5'
const logEl = document.getElementById('log')
const logs = []
function log(message, bad) {
  logs.push((bad ? '✗ ' : '· ') + message)
  logEl.textContent = logs.join('\n')
  logEl.className = bad ? 'bad' : 'ok'
  if (bad) console.error(message)
}

/* ---- the smallest React this component needs ---------------------------- */
let store = null
function createStore() {
  return { cells: [], effects: [], index: 0, pendingEffects: [] }
}
function depsChanged(previous, next) {
  if (previous === undefined || next === undefined) return true
  if (previous.length !== next.length) return true
  return previous.some((value, index) => !Object.is(value, next[index]))
}

const ReactStub = {
  createElement(type, props, ...children) {
    const flat = children.flat(Infinity).filter((child) => child !== null && child !== undefined && child !== false)
    return { type, props: Object.assign({}, props, { children: flat }) }
  },
  useState(initial) {
    const owner = store
    const index = owner.index++
    if (!(index in owner.cells)) owner.cells[index] = typeof initial === 'function' ? initial() : initial
    const set = (next) => {
      const value = typeof next === 'function' ? next(owner.cells[index]) : next
      if (Object.is(value, owner.cells[index])) return
      owner.cells[index] = value
      scheduleRender()
    }
    return [owner.cells[index], set]
  },
  useEffect(fn, deps) {
    const owner = store
    const index = owner.index++
    const previous = owner.effects[index]
    if (previous === undefined || depsChanged(previous.deps, deps)) {
      owner.effects[index] = { fn, deps }
      owner.pendingEffects.push(fn)
    }
  },
}

/* ---- render the element tree into real DOM ------------------------------ */
const SKIP_PROPS = new Set(['children', 'dangerouslySetInnerHTML'])
function mount(node, parent) {
  if (node === null || node === undefined || node === false) return
  if (typeof node === 'string' || typeof node === 'number') {
    parent.appendChild(document.createTextNode(String(node)))
    return
  }
  const el = document.createElement(node.type)
  if (node.props && typeof node.props.ref === 'function') node.props.ref(el)
  for (const [key, value] of Object.entries(node.props ?? {})) {
    if (SKIP_PROPS.has(key)) continue
    if (key === 'ref') continue
    if (typeof value === 'function') {
      if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), value)
      continue
    }
    if (key === 'className') el.setAttribute('class', value)
    else if (key === 'style' && value && typeof value === 'object') {
      for (const [name, cssValue] of Object.entries(value)) {
        if (name.startsWith('--')) el.style.setProperty(name, String(cssValue))
        else el.style[name] = cssValue
      }
    } else if (key === 'tabIndex') el.setAttribute('tabindex', String(value))
    else if (value !== undefined && value !== null) el.setAttribute(key, String(value))
  }
  if (node.props && node.props.dangerouslySetInnerHTML) el.innerHTML = node.props.dangerouslySetInnerHTML.__html
  for (const child of node.props?.children ?? []) mount(child, el)
  parent.appendChild(el)
}

/* ---- the stub Context --------------------------------------------------- */
// Headless virtual time does not tick the compositor, so drive the needle
// animation loop from timers instead. Only the harness does this.
if (typeof requestAnimationFrame !== 'function' || params.get('realraf') !== '1') {
  window.requestAnimationFrame = (callback) => setTimeout(() => callback(performance.now()), 16)
}

// Start from a clean per-session table so runs cannot inherit each other.
try {
  localStorage.removeItem('dsh-balance-gauge/sessions')
} catch (error) {
  /* storage unavailable */
}

const startedAt = Date.now()

/** The Node half's route, stubbed: ?rate=0 simulates an idle stream. */
const trafficRate = Number(params.get('rate') ?? 120)
window.fetch = async (url) => {
  if (String(url).indexOf('/balance-gauge/traffic') === -1) throw new Error('unexpected fetch ' + url)
  return {
    ok: true,
    status: 200,
    json: async () => ({ tokensPerSecond: trafficRate, windowMs: 3500, at: Date.now() }),
  }
}

const PAYLOADS = {
  fail: () => ({ ok: false, error: { code: 'unavailable' } }),
  signedout: () => ({ ok: true, value: { status: 'unavailable' } }),
  empty: () => ({ ok: true, value: { status: 'ready', value: [], bonusWallets: [] } }),
  normal: () => ({
    ok: true,
    value: {
      status: 'ready',
      value: [{ currency: 'CNY', balance: amount }],
      bonusWallets: [{ currency: 'CNY', balance: '2.00' }],
    },
  }),
}

const ctx = {
  locale: { getSnapshot: () => ({ active: 'zh-CN' }) },
  remote: {
    account: {
      async getBalance(metadata) {
        log('getBalance(' + JSON.stringify(metadata) + ')')
        if (!metadata.version) throw new Error('missing version')
        const build = PAYLOADS[amount] ?? PAYLOADS.normal
        return build()
      },
    },
  },
  slots: {
    inject(name, callback) {
      log('slots.inject(' + name + ')')
      callback()
    },
    register(spec, Component) {
      log('slots.register(' + spec.name + ' id=' + spec.id + ')')
      registered.push({ spec, Component, store: createStore() })
      paint()
    },
  },
}

/* ---- paint every registered entry, each with its own hook store ---------- */
const registered = []
let queued = false
function paint() {
  const container = document.getElementById('root')
  container.textContent = ''
  for (const entry of registered) {
    store = entry.store
    store.index = 0
    store.pendingEffects = []
    const host = document.createElement('div')
    host.className = 'mount'
    host.dataset.entry = String(entry.spec.id)
    container.appendChild(host)
    let element
    try {
      element = entry.Component({ wide: true })
    } catch (error) {
      log('component threw: ' + error.message, true)
      continue
    }
    mount(element, host)
    const effects = store.pendingEffects
    store.pendingEffects = []
    for (const effect of effects) {
      try {
        effect()
      } catch (error) {
        log('effect threw: ' + error.message, true)
      }
    }
  }
}

function scheduleRender() {
  if (queued) return
  queued = true
  setTimeout(() => {
    queued = false
    paint()
  }, 0)
}

// Repaint on a timer so the bridge re-reads the stub projection and publishes
// a growing token count, the way a live session would.
setInterval(paint, 400)

/* ---- load and run the real bundle -------------------------------------- */
window.__ModuleLoader__ = {
  load(record) {
    log('module loader: ' + record.id)
    let mod
    try {
      mod = record.factory((name) => {
        if (name === 'react') return ReactStub
        throw new Error('unexpected require: ' + name)
      })
    } catch (error) {
      log('factory threw: ' + error.message, true)
      return
    }
    log('exports: ' + Object.keys(mod).join(', '))
    log('inject: ' + JSON.stringify(mod.inject))
    try {
      mod.apply(ctx)
    } catch (error) {
      log('apply threw: ' + error.message, true)
    }
  },
}
</script>
<script>/* dsh-balance-gauge — generated by scripts/build.mjs, do not edit. */
window.__ModuleLoader__.load({
	id: "dsh-balance-gauge",
	factory: (require) => {
		var module = { exports: {} };
		var exports = module.exports;
		Object.defineProperty(exports, Symbol.toStringTag, { value: "Module" });
		const React = require("react");

		const CSS_TEXT = "/* Balance + speed gauges — every class is prefixed `bg-` so it cannot collide\n   with the shell. The pair lives in the sidebar footer row, directly above the\n   account launcher, and deliberately has no card chrome: no fill, no stroke,\n   no shadow, just a row highlight on hover. */\n\n.bg-root {\n  display: flex;\n  width: 100%;\n  min-width: 0;\n  padding: 0 0 6px;\n  box-sizing: border-box;\n}\n\n.bg-card {\n  display: flex;\n  align-items: center;\n  gap: 7px;\n  width: 100%;\n  min-width: 0;\n  padding: 5px 7px;\n  margin: 0 0 2px;\n  box-sizing: border-box;\n  border: none;\n  border-radius: 9px;\n  background: transparent;\n  box-shadow: none;\n  cursor: pointer;\n  user-select: none;\n  font-family: var(--dsw-font-family, inherit);\n  transition: background-color 0.15s ease;\n}\n\n.bg-card:hover {\n  background: var(--dsw-alias-interactive-bg-hover, rgba(16, 24, 40, 0.05));\n}\n\n.bg-card:active {\n  background: var(--dsw-alias-interactive-bg-hover, rgba(16, 24, 40, 0.07));\n}\n\n.bg-card:focus-visible {\n  outline: 2px solid var(--dsw-focus-ring-color, #4d6bfe);\n  outline-offset: 1px;\n}\n\n.bg-cell {\n  display: flex;\n  align-items: center;\n  gap: 5px;\n  flex: 1 1 0;\n  min-width: 0;\n}\n\n.bg-divider {\n  flex: none;\n  width: 1px;\n  height: 20px;\n  background: var(--dsw-alias-border-l2, #e4e7ec);\n  opacity: 0.9;\n}\n\n.bg-dial-host {\n  display: flex;\n  flex: none;\n  align-items: center;\n}\n\n.bg-dial {\n  display: block;\n  flex: none;\n  width: 46px;\n  height: 26px;\n  overflow: visible;\n}\n\n.bg-track {\n  fill: none;\n  stroke: var(--dsw-alias-border-l2, #e4e7ec);\n  stroke-width: 9;\n  stroke-linecap: round;\n}\n\n.bg-arc {\n  fill: none;\n  stroke-width: 9;\n  stroke-linecap: round;\n  transition: opacity 0.4s ease;\n}\n\n.bg-speed {\n  stroke: var(--dsw-alias-state-business-primary, #4d6bfe);\n}\n\n.bg-dial--dim .bg-arc {\n  opacity: 0.28;\n}\n\n.bg-dial--dim .bg-track {\n  opacity: 0.7;\n}\n\n/* The needle is driven frame by frame from client.js (damped spring), so it\n   must not also carry a CSS transition. */\n.bg-needle {\n  transform-box: view-box;\n  transform-origin: 60px 60px;\n  will-change: transform;\n}\n\n.bg-blade {\n  fill: var(--dsw-alias-label-primary, #1f2329);\n}\n\n.bg-tip {\n  fill: var(--dsw-alias-label-primary, #1f2329);\n}\n\n.bg-glow {\n  pointer-events: none;\n}\n\n.bg-hub {\n  fill: var(--dsw-alias-label-primary, #1f2329);\n}\n\n.bg-hub-dot {\n  fill: var(--dsw-alias-bg-base, #ffffff);\n}\n\n.bg-readout {\n  display: flex;\n  flex-direction: column;\n  min-width: 0;\n  line-height: 1.15;\n}\n\n.bg-amount {\n  font-size: 13px;\n  font-weight: 650;\n  letter-spacing: 0.2px;\n  color: var(--dsw-alias-label-primary, #1f2329);\n  font-variant-numeric: tabular-nums;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  transition: color 0.3s ease;\n}\n\n.bg-amount--speed {\n  color: var(--dsw-alias-label-primary, #1f2329);\n}\n\n.bg-card[data-zone='low'] .bg-amount--money {\n  color: var(--bg-zone-ink, #c0554d);\n}\n\n.bg-card[data-zone='high'] .bg-amount--money {\n  color: var(--bg-zone-ink, #3f8a66);\n}\n\n.bg-sub {\n  font-size: 10px;\n  line-height: 1.35;\n  color: var(--dsw-alias-label-tertiary, #8d93a1);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n.bg-pulse {\n  animation: bg-pulse 1.5s ease-in-out infinite;\n}\n\n@keyframes bg-pulse {\n  0%,\n  100% {\n    opacity: 1;\n  }\n  50% {\n    opacity: 0.4;\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .bg-needle,\n  .bg-arc {\n    transition: none;\n  }\n  .bg-pulse {\n    animation: none;\n  }\n}\n"
		const CSS_TAG_ID = 'dsh-balance-gauge/gauge.css'
		if (
			typeof document !== 'undefined' &&
			document.querySelector('style[data-plugin-css=' + JSON.stringify(CSS_TAG_ID) + ']') === null
		) {
			const tag = document.createElement('style')
			tag.dataset.plugin = 'dsh-balance-gauge'
			tag.dataset.pluginCss = CSS_TAG_ID
			tag.textContent = CSS_TEXT
			document.head.appendChild(tag)
		}

/**
 * Money / speed → gauge geometry, colour zones and copy.
 *
 * Pure: no DOM, no React. The client bundle and the offline preview both use
 * these functions, so the widget you look at and the widget that ships cannot
 * drift apart.
 */

/** Full tank: the needle sits on the right end of the scale at this amount. */
const FULL_SCALE = 100

/** Below this the gauge is red. Strict: 10 itself is still amber. */
const LOW_THRESHOLD = 10

/** Above this the gauge is green. Strict: 50 itself is still amber. */
const HIGH_THRESHOLD = 50

/**
 * Speedometer full scale, in tokens per second: 0 tok/s sits at the left end of
 * the 180° sweep, 500 tok/s at the right end.
 */
const SPEED_MAX = 500

/** One colour per zone, plus a neutral one for "no reading". */
const ZONE_COLORS = {
  low: '#D96C64',
  mid: '#D9A05F',
  high: '#6BA689',
  unknown: '#C9CED8',
}

/**
 * Ink for the amount, a shade deeper than the arc so the number stays legible.
 * Mid uses the ordinary label colour.
 */
const ZONE_INK = {
  low: '#C0554D',
  mid: '',
  high: '#3F8A66',
  unknown: '',
}

/** The three painted ranges, in scale units. */
const ZONES = [
  { zone: 'low', from: 0, to: LOW_THRESHOLD },
  { zone: 'mid', from: LOW_THRESHOLD, to: HIGH_THRESHOLD },
  { zone: 'high', from: HIGH_THRESHOLD, to: FULL_SCALE },
]

/** Per-state copy: an emoji plus a short, colloquial line. */
const COPY = {
  high: { emoji: '😄', text: '油箱满满' },
  mid: { emoji: '🙂', text: '还够跑一阵' },
  low: { emoji: '😰', text: '油快没啦' },
  loading: { emoji: '⛽', text: '正在量油…' },
  unavailable: { emoji: '🔒', text: '先登录账户' },
  failed: { emoji: '🥲', text: '读不到数，点我重试' },
}

/** Dial centre and radius, in viewBox units. */
const CX = 60
const CY = 60
const RADIUS = 42

/** Gap, in degrees, cut out of the arc at each zone boundary. */
const GAP_DEG = 2.2

/** Clamp a number into [min, max]. */
function clamp(value, min, max) {
  return value < min ? min : value > max ? max : value
}

/** The zone a balance falls in. */
function zoneOf(balance) {
  if (!Number.isFinite(balance)) return 'unknown'
  if (balance < LOW_THRESHOLD) return 'low'
  if (balance > HIGH_THRESHOLD) return 'high'
  return 'mid'
}

/** Needle position as a 0–1 fraction of the money scale. */
function percentOf(balance) {
  if (!Number.isFinite(balance)) return 0
  return clamp(balance / FULL_SCALE, 0, 1)
}

/** Needle position as a 0–1 fraction of the speed scale. */
function speedPercent(speed) {
  if (!Number.isFinite(speed) || speed <= 0) return 0
  return clamp(speed / SPEED_MAX, 0, 1)
}

/** Whole tokens per second; sub-1 readings collapse to 0. */
function formatSpeed(speed) {
  if (!Number.isFinite(speed) || speed <= 0) return '0'
  return String(Math.round(speed))
}

/** The needle's CSS rotation: -90deg points at empty, +90deg at full. */
function needleDegrees(percent) {
  return clamp(percent, 0, 1) * 180 - 90
}

/** Group digits: 1234.5 → 1,234.50. */
function groupDigits(fixed) {
  const [whole, fraction] = fixed.split('.')
  return whole.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (fraction === undefined ? '' : `.${fraction}`)
}

/** A currency symbol, or the code itself for currencies we do not know. */
function currencySymbol(currency) {
  if (currency === 'CNY' || currency === 'RMB') return '¥'
  if (currency === 'USD') return '$'
  return typeof currency === 'string' && currency.length > 0 ? `${currency} ` : '¥'
}

/** Two decimals, thousands grouped, symbol first. */
function formatMoney(balance, currency) {
  const value = Number(balance)
  const fixed = Number.isFinite(value) ? value.toFixed(2) : '0.00'
  return `${currencySymbol(currency)}${groupDigits(fixed)}`
}

/** Point on the dial for an angle measured from the positive x axis. */
function polar(degrees, radius) {
  const radians = (degrees * Math.PI) / 180
  return {
    x: CX + radius * Math.cos(radians),
    y: CY - radius * Math.sin(radians),
  }
}

/**
 * One clockwise arc between two scale fractions.
 *
 * 0 is the left end of the semicircle, 1 the right end; both ends sit on the
 * dial's horizontal diameter.
 */
function arcPath(fromPercent, toPercent, radius = RADIUS) {
  const fromDeg = 180 - clamp(fromPercent, 0, 1) * 180
  const toDeg = 180 - clamp(toPercent, 0, 1) * 180
  const start = polar(fromDeg, radius)
  const end = polar(toDeg, radius)
  const largeArc = Math.abs(fromDeg - toDeg) > 180 ? 1 : 0
  return `M ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${radius} ${radius} 0 ${largeArc} 1 ${end.x.toFixed(2)} ${end.y.toFixed(2)}`
}

/** The three coloured arcs, with a small gap cut at each boundary. */
function zonePaths() {
  const gap = GAP_DEG / 180
  return ZONES.map(({ zone, from, to }) => {
    const fromPercent = from / FULL_SCALE
    const toPercent = to / FULL_SCALE
    const start = from === 0 ? fromPercent : fromPercent + gap
    const end = to === FULL_SCALE ? toPercent : toPercent - gap
    return { zone, color: ZONE_COLORS[zone], d: arcPath(start, end) }
  })
}

/** The needle geometry, shared by the string and React renderers. */
const NEEDLE = {
  blade: '57.4,60 60,28.5 62.6,60',
  hubRadius: 5.4,
  dotRadius: 1.9,
  glowRadius: 11,
}

/** The track plus the three coloured zone arcs, as an SVG fragment string. */
function dialTracks(options) {
  const zone = (options && options.zone) || 'unknown'
  const dim = !!(options && options.dim)
  const pulse = zone === 'low' && !dim ? ' bg-pulse' : ''
  const arcs = zonePaths()
    .map(({ zone: name, color, d }) => `<path class="bg-arc${name === zone ? pulse : ''}" d="${d}" stroke="${color}" />`)
    .join('')
  return `<path class="bg-track" d="${arcPath(0, 1)}" />${arcs}`
}

/** The track plus the accent arc filled up to the reading, as a string. */
function speedTracks(options) {
  const percent = clamp(Number(options && options.percent) || 0, 0, 1)
  const filled = percent > 0.004 ? `<path class="bg-arc bg-speed" d="${arcPath(0, percent)}" />` : ''
  return `<path class="bg-track" d="${arcPath(0, 1)}" />${filled}`
}

/** Static needle markup, for the offline preview (the app animates it). */
function needleMarkup(percent, tint, dim) {
  if (dim) return ''
  const rotation = needleDegrees(percent).toFixed(2)
  return (
    `<g class="bg-needle" style="transform: rotate(${rotation}deg)">` +
    `<circle cx="60" cy="60" r="${NEEDLE.glowRadius}" class="bg-glow" fill="${tint}" opacity="0.14" />` +
    `<polygon class="bg-blade" points="${NEEDLE.blade}" />` +
    `<circle cx="60" cy="60" r="${NEEDLE.hubRadius}" class="bg-hub" />` +
    `<circle cx="60" cy="60" r="${NEEDLE.dotRadius}" class="bg-hub-dot" />` +
    `</g>`
  )
}

/**
 * The balance dial as a complete SVG string (static needle).
 *
 * The client bundle renders the tracks and the needle separately so it can
 * animate the needle in place; this whole-string form is for the preview.
 */
function dialSvg(options) {
  const percent = clamp(Number(options && options.percent) || 0, 0, 1)
  const zone = (options && options.zone) || 'unknown'
  const dim = !!(options && options.dim)
  const tint = ZONE_COLORS[zone] || ZONE_COLORS.unknown
  const label = `余额油量 ${Math.round(percent * 100)}%`
  return (
    `<svg class="bg-dial" viewBox="0 0 120 68" role="img" aria-label="${label}">` +
    dialTracks(options) +
    needleMarkup(percent, tint, dim) +
    `</svg>`
  )
}

/**
 * The speedometer dial as a complete SVG string (static needle).
 *
 * The accent comes from the theme token (`--dsw-alias-state-business-primary`)
 * via the `.bg-speed` class, because a CSS variable cannot be written into a
 * stroke attribute.
 */
function speedDialSvg(options) {
  const percent = clamp(Number(options && options.percent) || 0, 0, 1)
  const dim = !!(options && options.dim)
  const label = `输出速度 ${Math.round(percent * 100)}%`
  return (
    `<svg class="bg-dial" viewBox="0 0 120 68" role="img" aria-label="${label}">` +
    speedTracks(options) +
    needleMarkup(percent, '#4D6BFE', dim) +
    `</svg>`
  )
}

/**
 * Browser half: two small dials pinned to the sidebar foot, directly above the
 * account / settings row — account balance on the left, live output speed on
 * the right.
 *
 * The balance comes from the account Remote the shell already mounts
 * (`ctx.remote.account.getBalance`), so this plugin reads no files, holds no
 * API key, and talks to no new endpoint.
 *
 * The speed is total traffic: the Node half of this plugin counts every
 * streamed delta the Host emits (every session, every subagent) and answers
 * `GET /balance-gauge/traffic` with a sliding-window rate. This half just polls
 * it — no per-session statistics, so nothing can jump when sessions switch.
 *
 * Both needles are driven by one damped-spring animation loop rather than CSS
 * transitions: data changes only move the target, the needle glides there with
 * mass, like a real instrument.
 */

/** Automatic re-read interval once a reading succeeds. */
const REFRESH_MS = 60000

/** Retry ladder while reading the balance fails. */
const RETRY_DELAYS = [1500, 4000, 10000, 30000]

/** Traffic poll period. */
const SAMPLE_MS = 300

/** Where the Node half publishes the global rate. */
const TRAFFIC_ROUTE = '/balance-gauge/traffic'

/** Above this the gauge counts as "generating" (and trembles). */
const LIVE_FLOOR = 0.5

/** Needle spring: stiff enough to track, damped enough not to wobble. */
const NEEDLE_STIFFNESS = 120
const NEEDLE_DAMPING = 19
const NEEDLE_EPSILON = 0.0005

/**
 * Live tremor, the way a dashboard needle shakes with the engine: two
 * incommensurate sines so it does not read as a clean oscillation. It only runs
 * while tokens are actually flowing, so an idle gauge is still.
 */
const TREMOR_MAX_DEG = 4
const TREMOR_HZ = 11.5
const TREMOR_HZ_SLOW = 4.7
const TREMOR_GAIN = 3.2

/** The version literal the account Remote expects; the boot graph carries it. */
const FALLBACK_CLIENT_VERSION = '0.2.1-rc.2'

/* ------------------------------------------------------------------ needles */

/** One entry per dial: where it points now, where it is heading, its momentum. */
const needleRig = {
  money: { target: 0, position: 0, velocity: 0, element: null, phase: 0, trembles: false, live: false },
  speed: { target: 0, position: 0, velocity: 0, element: null, phase: 0, trembles: true, live: false },
}

/** The one animation loop, started on first needle mount. */
let needleAnimation = null

/** Write the current position (plus any tremor) onto the needle's transform. */
function paintNeedle(state, offset) {
  if (state.element === null) return
  const degrees = state.position * 180 - 90 + (offset || 0)
  state.element.style.transform = `rotate(${degrees.toFixed(2)}deg)`
}

/** Integrate one frame of the spring for both needles. */
function stepNeedles() {
  const now = performance.now()
  const dt = Math.min(0.05, Math.max(0.001, (now - needleAnimation.last) / 1000))
  needleAnimation.last = now
  for (const key of ['money', 'speed']) {
    const state = needleRig[key]
    if (state.element === null) {
      state.position = state.target
      state.velocity = 0
      continue
    }
    if (needleAnimation.still) {
      state.position = state.target
      state.velocity = 0
      paintNeedle(state, 0)
      continue
    }
    const before = state.position
    const delta = state.target - state.position
    state.velocity += delta * NEEDLE_STIFFNESS * dt
    state.velocity *= Math.exp(-NEEDLE_DAMPING * dt)
    state.position += state.velocity * dt
    if (Math.abs(delta) < NEEDLE_EPSILON && Math.abs(state.velocity) < NEEDLE_EPSILON) {
      state.position = state.target
      state.velocity = 0
    }
    // Live tremor: strongest at full scale, gone at zero, and only while tokens
    // are flowing, so an idle gauge stays perfectly still.
    let tremor = 0
    if (state.trembles && state.live) {
      const amplitude = TREMOR_MAX_DEG * Math.min(1, Math.max(0, state.target) * TREMOR_GAIN)
      if (amplitude > 0.01) {
        state.phase = (state.phase + dt) % 1000
        tremor =
          amplitude *
          (Math.sin(state.phase * TREMOR_HZ * 2 * Math.PI) * 0.62 +
            Math.sin(state.phase * TREMOR_HZ_SLOW * 2 * Math.PI + 1.7) * 0.38)
      }
    }
    // A still needle writes nothing: the loop idles until a target or the
    // tremor moves it.
    if (state.position !== before || tremor !== 0) paintNeedle(state, tremor)
  }
  needleAnimation.frame = requestAnimationFrame(stepNeedles)
}

/** Idempotent start of the animation loop. */
function ensureNeedleAnimation() {
  if (needleAnimation !== null) return
  let still = false
  try {
    still = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches
  } catch (error) {
    still = false
  }
  needleAnimation = { last: performance.now(), frame: 0, still: still }
  needleAnimation.frame = requestAnimationFrame(stepNeedles)
}

/** Callback ref for one dial's needle group. */
function attachNeedle(key) {
  return (element) => {
    if (element === null) return
    const state = needleRig[key]
    state.element = element
    ensureNeedleAnimation()
    paintNeedle(state, 0)
  }
}

/** The SVG for one dial: rendered tracks plus a React-owned, animated needle. */
function dialElement(options) {
  const dim = !!options.dim
  const needle = dim
    ? null
    : React.createElement(
        'g',
        { className: 'bg-needle', ref: attachNeedle(options.key) },
        React.createElement('circle', {
          cx: 60,
          cy: 60,
          r: NEEDLE.glowRadius,
          className: 'bg-glow',
          fill: options.tint,
          opacity: 0.14,
        }),
        React.createElement('polygon', { className: 'bg-blade', points: NEEDLE.blade }),
        React.createElement('circle', { cx: 60, cy: 60, r: NEEDLE.hubRadius, className: 'bg-hub' }),
        React.createElement('circle', { cx: 60, cy: 60, r: NEEDLE.dotRadius, className: 'bg-hub-dot' }),
      )
  return React.createElement(
    'svg',
    { className: 'bg-dial', viewBox: '0 0 120 68', role: 'img', 'aria-label': options.label },
    React.createElement('g', { dangerouslySetInnerHTML: { __html: options.tracks } }),
    needle,
  )
}

/* --------------------------------------------------------------- data reads */

/** Read the Host release version out of the boot payload, if it is there. */
function readClientVersion() {
  try {
    const boot = globalThis.__DSH_BOOT__
    const release = boot && boot.release
    const manifestRelease = boot && boot.manifest && boot.manifest.release
    const version = (release && release.version) || (manifestRelease && manifestRelease.version) || (boot && boot.version)
    if (typeof version === 'string' && version.length > 0) return version
  } catch (error) {
    /* boot payload absent: fall through to the literal */
  }
  return FALLBACK_CLIENT_VERSION
}

/** Read the active UI language, defaulting to Chinese. */
function readLocale(ctx) {
  try {
    const snapshot = ctx.locale && typeof ctx.locale.getSnapshot === 'function' ? ctx.locale.getSnapshot() : undefined
    const active = snapshot && snapshot.active
    if (typeof active === 'string' && active.length > 0) return active
  } catch (error) {
    /* locale service absent */
  }
  return 'zh-CN'
}

/** The account Remote, however the shell happens to expose the namespace. */
function accountRemote(ctx) {
  try {
    const direct = ctx.remote && ctx.remote.account
    if (direct && typeof direct.getBalance === 'function') return direct
  } catch (error) {
    /* fall through to the named lookup */
  }
  try {
    if (typeof ctx.get === 'function') {
      const named = ctx.get('remote.account')
      if (named && typeof named.getBalance === 'function') return named
      const parent = ctx.get('remote')
      const nested = parent && parent.account
      if (nested && typeof nested.getBalance === 'function') return nested
    }
  } catch (error) {
    /* not registered under that name either */
  }
  return undefined
}

/** The amount of one wallet: the platform's `balance` field, `amount` as a fallback. */
function walletAmount(wallet) {
  if (!wallet) return undefined
  const value = wallet.balance !== undefined ? wallet.balance : wallet.amount
  return typeof value === 'string' || typeof value === 'number' ? value : undefined
}

/** Every wallet the account Remote returned, recharge and bonus alike. */
function readWallets(outcome) {
  const normal = Array.isArray(outcome && outcome.value) ? outcome.value : []
  const bonus = Array.isArray(outcome && outcome.bonusWallets) ? outcome.bonusWallets : []
  return normal.concat(bonus).filter((wallet) => walletAmount(wallet) !== undefined)
}

/** Sum the wallets of one currency. */
function totalOf(wallets, currency) {
  let total = 0
  for (const wallet of wallets) {
    if (wallet.currency !== currency) continue
    const value = Number(walletAmount(wallet))
    if (Number.isFinite(value)) total += value
  }
  return total
}

/** Pick the currency to display: CNY when present, else the first wallet's. */
function pickBalance(outcome) {
  const wallets = readWallets(outcome)
  if (wallets.length === 0) return undefined
  const currencies = []
  for (const wallet of wallets) {
    if (typeof wallet.currency === 'string' && currencies.indexOf(wallet.currency) === -1) currencies.push(wallet.currency)
  }
  const currency = currencies.indexOf('CNY') === -1 ? currencies[0] : 'CNY'
  if (typeof currency !== 'string') return undefined
  return { currency: currency, total: totalOf(wallets, currency) }
}

/** Build the sidebar entry bound to one client context. */
function createGauge(ctx) {
  return function BalanceGauge(props) {
    const [nonce, setNonce] = React.useState(0)
    const [view, setView] = React.useState({ phase: 'loading' })
    const [speed, setSpeed] = React.useState(0)
    const [live, setLive] = React.useState(false)
    const [trafficReady, setTrafficReady] = React.useState(false)

    // The collapsed rail is 56px wide: no room for a dial, and the account row
    // it sits above is an icon there too.
    const wide = !props || props.wide !== false

    React.useEffect(() => {
      if (!wide) return undefined
      let cancelled = false
      let timer
      let attempt = 0

      const settle = (delay) => {
        if (!cancelled) timer = setTimeout(load, delay)
      }

      const load = async () => {
        let next
        try {
          const account = accountRemote(ctx)
          if (account === undefined) {
            next = { phase: 'failed', reason: 'service' }
          } else {
            const result = await account.getBalance({
              version: readClientVersion(),
              locale: readLocale(ctx),
              timezoneOffsetSeconds: -new Date().getTimezoneOffset() * 60,
            })
            if (cancelled) return
            if (!result || result.ok !== true) {
              next = { phase: 'failed', reason: (result && result.error && result.error.code) || 'rpc' }
            } else {
              const outcome = result.value
              if (!outcome || outcome.status !== 'ready') {
                next = { phase: 'unavailable', reason: (outcome && outcome.status) || 'unknown' }
              } else {
                const picked = pickBalance(outcome)
                next =
                  picked === undefined
                    ? { phase: 'failed', reason: 'shape' }
                    : { phase: 'ready', balance: picked.total, currency: picked.currency, at: Date.now() }
              }
            }
          }
        } catch (error) {
          if (cancelled) return
          next = { phase: 'failed', reason: (error && error.message) || 'error' }
        }
        if (cancelled) return
        setView(next)
        if (next.phase === 'ready') {
          attempt = 0
          settle(REFRESH_MS)
        } else {
          console.warn('[dsh-balance-gauge]', next.phase, next.reason)
          settle(RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)])
          attempt += 1
        }
      }

      load()
      return () => {
        cancelled = true
        clearTimeout(timer)
      }
    }, [nonce, wide])

    // Total traffic: the Host's sliding-window rate over every streamed delta.
    // It already decays on its own when the stream stops, so there is nothing
    // to average and nothing to unwind here.
    React.useEffect(() => {
      if (!wide) return undefined
      let cancelled = false
      const tick = async () => {
        try {
          const response = await fetch(TRAFFIC_ROUTE, { cache: 'no-store' })
          if (!response.ok) throw new Error(`http ${response.status}`)
          const payload = await response.json()
          if (cancelled) return
          const value = Number(payload && payload.tokensPerSecond)
          const rate = Number.isFinite(value) && value > 0 ? value : 0
          setSpeed(rate)
          setLive(rate > LIVE_FLOOR)
          setTrafficReady(true)
          needleRig.speed.live = rate > LIVE_FLOOR
        } catch (error) {
          if (cancelled) return
          setSpeed(0)
          setLive(false)
          setTrafficReady(false)
          needleRig.speed.live = false
        }
      }
      tick()
      const timer = setInterval(tick, SAMPLE_MS)
      return () => {
        cancelled = true
        clearInterval(timer)
        needleRig.speed.live = false
      }
    }, [wide])

    const ready = view.phase === 'ready'
    const zone = ready ? zoneOf(view.balance) : 'unknown'
    const percent = ready ? percentOf(view.balance) : 0
    const speedPercentValue = speedPercent(speed)

    // Data changes only move the target; the loop does the travelling.
    React.useEffect(() => {
      needleRig.money.target = percent
    }, [percent])
    React.useEffect(() => {
      needleRig.speed.target = speedPercentValue
    }, [speedPercentValue])

    if (!wide) return null

    const copy = COPY[ready ? zone : view.phase] || COPY.loading
    const amount = ready ? formatMoney(view.balance, view.currency) : view.phase === 'loading' ? '···' : '--'
    const reason = view.reason === undefined ? '' : String(view.reason).slice(0, 12)
    const subText = ready || reason === '' ? `${copy.emoji} ${copy.text}` : `${copy.emoji} ${copy.text} · ${reason}`
    const hint = ready
      ? `${formatMoney(view.balance, view.currency)} · 满格 ¥${FULL_SCALE} · 单击刷新`
      : view.phase === 'loading'
        ? '正在读取账户余额'
        : `${copy.text}${reason === '' ? '' : `（${reason}）`} · 单击重试`

    const speedHint = !trafficReady
      ? '读不到全进程流量（宿主路由 /balance-gauge/traffic 未响应，可能还没重启）'
      : live
        ? `正在输出 ${formatSpeed(speed)} tok/s · 全进程实时流量（含子代理），满格 ${SPEED_MAX}`
        : `空闲 · 全进程实时流量已经在回落，满格 ${SPEED_MAX}`

    const refresh = () => setNonce((current) => current + 1)

    return React.createElement(
      'div',
      { className: 'bg-root' },
      React.createElement(
        'div',
        {
          className: 'bg-card',
          'data-zone': zone,
          'data-phase': view.phase,
          role: 'button',
          tabIndex: 0,
          title: `${hint}\n${speedHint}`,
          // Zone tints travel as custom properties so the arcs (SVG, built in
          // gauge.js) and the amount ink (CSS) share one palette.
          style: { '--bg-zone': ZONE_COLORS[zone] || ZONE_COLORS.unknown, '--bg-zone-ink': ZONE_INK[zone] || '' },
          onClick: refresh,
          onKeyDown: (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault()
              refresh()
            }
          },
        },
        React.createElement(
          'span',
          { className: 'bg-cell' },
          React.createElement(
            'span',
            { className: 'bg-dial-host' },
            dialElement({
              key: 'money',
              tracks: dialTracks({ zone: zone, dim: !ready }),
              tint: ZONE_COLORS[zone] || ZONE_COLORS.unknown,
              label: `余额油量 ${Math.round(percent * 100)}%`,
              dim: !ready,
            }),
          ),
          React.createElement(
            'span',
            { className: 'bg-readout' },
            React.createElement('span', { className: 'bg-amount bg-amount--money' }, amount),
            React.createElement('span', { className: 'bg-sub' }, subText),
          ),
        ),
        React.createElement('span', { className: 'bg-divider' }),
        React.createElement(
          'span',
          { className: 'bg-cell' },
          React.createElement(
            'span',
            { className: 'bg-dial-host' },
            dialElement({
              key: 'speed',
              tracks: speedTracks({ percent: speedPercentValue, dim: !trafficReady }),
              tint: '#4D6BFE',
              label: `输出速度 ${Math.round(speedPercentValue * 100)}%`,
              dim: !trafficReady,
            }),
          ),
          React.createElement(
            'span',
            { className: 'bg-readout' },
            React.createElement('span', { className: 'bg-amount bg-amount--speed' }, formatSpeed(speed)),
            React.createElement('span', { className: 'bg-sub' }, 'tok/s'),
          ),
        ),
      ),
    )
  }
}

/** Services the sidebar registration needs. */
const inject = ['slots', 'remote', 'locale']

/** Client plugin body: register the twin gauges above the account row. */
function apply(ctx) {
  const BalanceGauge = createGauge(ctx)
  ctx.slots.inject('sidebar.footer.action', () =>
    ctx.slots.register(
      {
        name: 'sidebar.footer.action',
        id: 'balance-gauge',
        order: 100,
        label: '余额与速度表',
        registrant: 'dsh-balance-gauge',
      },
      BalanceGauge,
    ),
  )
}

		exports.apply = apply;
		exports.inject = inject;
		return module.exports;
	}
});
</script>
<script>
  if (params.get('probe') === '1') {
    const output = document.createElement('pre')
    output.id = 'result'
    output.textContent = 'probe pending'
    document.body.appendChild(output)
    const calls = () => logs.filter((line) => line.indexOf('getBalance(') !== -1).length
    const needles = () =>
      Array.from(document.querySelectorAll('.bg-needle')).map((node) => node.style.transform || '(unset)')
    setTimeout(() => {
      const money = document.querySelector('.bg-amount--money')
      const speed = document.querySelector('.bg-amount--speed')
      const card = document.querySelector('.bg-card')
      const before = calls()
      const needlesBefore = needles()
      if (params.get('click') === '1' && card) card.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }))
      setTimeout(() => {
        output.textContent = 'probe ' + JSON.stringify({
          money: money ? money.textContent : null,
          speed: speed ? speed.textContent : null,
          zone: card ? card.getAttribute('data-zone') : null,
          phase: card ? card.getAttribute('data-phase') : null,
          entries: registered.map((entry) => entry.spec.id),
          callsBefore: before,
          callsAfter: calls(),
          needlesBefore: needlesBefore,
          needlesAfter: needles(),
        })
      }, 600)
    }, Number(params.get('probeAt') || 2200))
  }
</script>
</body>
